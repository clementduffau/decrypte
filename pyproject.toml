[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decrypte-2027"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]
[project.scripts]
decrypte = "decrypte.points_entree.cli:main"
decrypte-api = "decrypte.points_entree.api:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
]
[tool.setuptools.packages.find]
where = ["src"]
